<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- SEO Meta Tags -->
  <title>NTE Bond Optimizer - Neverness to Everness Gift Calculator</title>
  <meta name="description" content="Optimize your Bond leveling in Neverness to Everness with smart gift recommendations and cost analysis.">
  <meta name="keywords" content="NTE, Neverness to Everness, Bond Optimizer, Gift Calculator, Game Tools">
  <meta name="author" content="NTE Community">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="NTE Bond Optimizer">
  <meta property="og:description" content="Max Bond. Less Guessing. Optimize your gift routes in Neverness to Everness.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://your-domain.com/ml/bond.html">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="NTE Bond Optimizer">
  <meta name="twitter:description" content="Optimize your Bond leveling with smart gift recommendations.">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://your-domain.com/ml/app/bond.html">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
  
  <!-- Immediate Redirect -->
  <meta http-equiv="refresh" content="0; url=app/bond.html">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% -10%, #1a2637 0, #090d14 40%, #06080c 100%);
      color: #f4f7fb;
      font-family: Inter, 'Segoe UI', Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    
    .redirect-container {
      max-width: 400px;
    }
    
    .logo {
      font-size: 48px;
      margin-bottom: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #72ddff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p {
      color: #8995a5;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #273140;
      border-top: 3px solid #72ddff;
      border-radius: 50%;
      margin: 20px auto;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    a {
      color: #72ddff;
      text-decoration: none;
      padding: 10px 20px;
      border: 1px solid #273140;
      border-radius: 10px;
      display: inline-block;
      margin-top: 10px;
      transition: all 0.3s;
    }
    
    a:hover {
      background: rgba(114, 221, 255, 0.1);
      border-color: #72ddff;
    }
  </style>
  
  <script>
    // Immediate redirect with fallback
    (function() {
      const targetUrl = 'app/bond.html';
      
      // Try multiple redirect methods for compatibility
      setTimeout(function() {
        window.location.replace(targetUrl);
      }, 100);
      
      // Fallback for older browsers
      setTimeout(function() {
        if (window.location.href.indexOf('app/bond.html') === -1) {
          window.location.href = targetUrl;
        }
      }, 1000);
    })();
  </script>
</head>
<body>
  <div class="redirect-container">
    <div class="logo">❤️</div>
    <h1>NTE Bond Optimizer</h1>
    <p>Redirecting to the Bond Optimizer tool...</p>
    <div class="loading-spinner"></div>
    <p>
      <a href="app/bond.html">
        Click here if you are not redirected automatically
      </a>
    </p>
  </div>
</body>
</html>
